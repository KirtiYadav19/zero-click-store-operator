{% extends 'base.html' %}

{% block title %}Create Your Shop - Zero-Click Store Operator{% endblock %}

{% block content %}
<div class="card">
    <h2>Create Your Shop</h2>
    <p style="margin-bottom: 1.5rem; color: #666;">Fill in your shop details to get started on Zero-Click Store Operator.</p>
    <form method="post" action="{% url 'shopkeeper_create_shop' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Shop Name *</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Rahul General Store">
        </div>
        <div class="form-group">
            <label for="phone">Shop Contact Phone</label>
            <input type="text" id="phone" name="phone" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
            <label for="address">Shop Address</label>
            <textarea id="address" name="address" rows="3" placeholder="e.g. Shop #12, Main Market, Sector 4"></textarea>
        </div>
        <button type="submit" class="btn">Create Shop</button>
    </form>
</div>
{% endblock %}
