{% extends 'base.html' %}

{% block title %}Shopkeeper Registration - Zero-Click Store Operator{% endblock %}

{% block content %}
<div class="card">
    <h2>Shopkeeper Registration</h2>
    <form method="post" action="{% url 'shopkeeper_register' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="text" id="phone" name="phone" required placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn">Register & Continue</button>
    </form>
    <a href="{% url 'shopkeeper_login' %}" class="footer-link">Already have an account? Login here</a>
</div>
{% endblock %}
