{% extends 'base.html' %}

{% block title %}Shopkeeper Login - Zero-Click Store Operator{% endblock %}

{% block content %}
<div class="card">
    <h2>Shopkeeper Login</h2>
    <form method="post" action="{% url 'shopkeeper_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <a href="{% url 'shopkeeper_register' %}" class="footer-link">Don't have an account? Register here</a>
</div>
{% endblock %}
